services:
  monolith.codes-postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "2109:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Monolith -d MonoDB"]
      interval: 10s
      retries: 5
  monolith.codes-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/usr/app
      - /usr/app/node_modules
    ports:
      - "4000:1909"
    depends_on:
      monolith.codes-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@monolith.codes-postgres:5432/${POSTGRES_DB}
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"    # CHANGED: This forces the container to stay awake forever, 
    # even if your Node app isn't running yet.

  monolith.codes-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/usr/app
      - /usr/app/node_modules
    ports:
      - "3019:3019"
    depends_on:
      - monolith.codes-postgres
      - monolith.codes-backend
    environment:
      - NUXT_API_BASE=http://monolith.codes-backend:1909
      - NUXT_PUBLIC_API_BASE=http://localhost:4000
    command: npm run dev